<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Free Bites at Vandy mark">
          <defs>
            <radialGradient id="sweepGrad" cx="50%" cy="50%" r="60%">
              <stop offset="0%" stop-color="#866D4B" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#866D4B" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <!-- outer radar rings, SF-symbol monoline weight -->
          <circle cx="50" cy="50" r="46" fill="none" stroke="#000000" stroke-width="4"/>
          <circle cx="50" cy="50" r="33" fill="none" stroke="#000000" stroke-width="3" opacity="0.55"/>
          <circle cx="50" cy="50" r="20" fill="none" stroke="#000000" stroke-width="3" opacity="0.3"/>
          <!-- sweep wedge in Vanderbilt gold -->
          <path d="M50 50 L50 4 A46 46 0 0 1 92.5 36 Z" fill="url(#sweepGrad)"/>
          <path d="M50 50 L50 4 A46 46 0 0 1 92.5 36 Z" fill="none" stroke="#866D4B" stroke-width="2" stroke-linejoin="round" opacity="0.9"/>
          <!-- fork as radar needle: tines point to 12 o'clock -->
          <g transform="translate(50,50)">
            <!-- handle -->
            <rect x="-2.6" y="-2" width="5.2" height="34" rx="2.6" fill="#000000"/>
            <!-- neck -->
            <path d="M-2.6 -2 L-2.6 -14 Q-2.6 -20 0 -20 Q2.6 -20 2.6 -14 L2.6 -2 Z" fill="#000000"/>
            <!-- three tines -->
            <rect x="-9" y="-40" width="4.2" height="22" rx="2.1" fill="#000000"/>
            <rect x="-2.1" y="-44" width="4.2" height="26" rx="2.1" fill="#000000"/>
            <rect x="4.8" y="-40" width="4.2" height="22" rx="2.1" fill="#000000"/>
            <!-- tine bridge -->
            <path d="M-9 -20 Q0 -14 8.9 -20 L8.9 -17 Q0 -11.5 -9 -17 Z" fill="#000000"/>
            <!-- center hub / blip -->
            <circle cx="0" cy="0" r="4.4" fill="#0066cc"/>
          </g>
          <!-- blips: campus locations detected by radar -->
          <circle cx="74" cy="30" r="2.6" fill="#0066cc"/>
          <circle cx="24" cy="66" r="2" fill="#0066cc" opacity="0.6"/>
          <circle cx="68" cy="70" r="1.6" fill="#0066cc" opacity="0.4"/>
        </svg>