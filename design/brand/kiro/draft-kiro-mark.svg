<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>Vandy Food Radar — standalone mark</title>
  <desc>Transparent mark: a heavier dark fork-and-spoon V inside an open radar ring, with one gold discovery point.</desc>

  <!-- Open radar arc -->
  <path d="M55.5 37A24 24 0 1 1 41.5 9.95" stroke="#1C1C1C" stroke-width="2.6"
        stroke-linecap="round" fill="none"/>

  <!-- Filled V, same construction as the icon -->
  <path d="
    M 17.6 24.3
    L 24.6 24.3
    L 32 41.9
    L 39.4 24.3
    L 46.4 24.3
    L 36.0 48.0
    C 35.3 49.55 34.0 50.3 32 50.3
    C 30.0 50.3 28.7 49.55 28.0 48.0
    Z"
    fill="#1C1C1C"/>

  <!-- Fork tines -->
  <g fill="#1C1C1C">
    <rect x="18.4" y="12.2" width="2.6" height="9.6" rx="1.3"/>
    <rect x="22.6" y="12.2" width="2.6" height="9.6" rx="1.3"/>
    <path d="M17.1 19.4c0 3.9 2.3 6.1 4.8 6.1s4.8-2.2 4.8-6.1h-2.6c0 2.4-1.1 3.5-2.2 3.5s-2.2-1.1-2.2-3.5z"/>
  </g>

  <!-- Spoon bowl -->
  <ellipse cx="43.6" cy="18.4" rx="4.6" ry="7.0" fill="#1C1C1C"/>

  <!-- Discovery point, the mark's only gold element -->
  <circle cx="53" cy="11" r="3.3" fill="#CFAE70"/>
</svg>
