<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>Vandy Food Radar — Claude refinement</title>
  <desc>A heavier filled fork-and-spoon V with an open radar ring and one gold discovery point, on a charcoal rounded square.</desc>
  <rect width="64" height="64" rx="16" fill="#1C1C1C"/>

  <!-- Open radar arc, unchanged weight and sweep -->
  <path d="M55.5 37A24 24 0 1 1 41.5 9.95" stroke="#CFAE70" stroke-width="2.6"
        stroke-linecap="round" fill="none" opacity=".8"/>

  <!-- Filled V: two tapered legs meeting at a rounded apex, ~7.6 units wide at the shoulders -->
  <path d="
    M 17.6 24.3
    L 24.6 24.3
    L 32 41.9
    L 39.4 24.3
    L 46.4 24.3
    L 36.0 48.0
    C 35.3 49.55 34.0 50.3 32 50.3
    C 30.0 50.3 28.7 49.55 28.0 48.0
    Z"
    fill="#CFAE70"/>

  <!-- Fork tines, set with air above the left leg's shoulder -->
  <g fill="#CFAE70">
    <rect x="18.4" y="12.2" width="2.6" height="9.6" rx="1.3"/>
    <rect x="22.6" y="12.2" width="2.6" height="9.6" rx="1.3"/>
    <path d="M17.1 19.4c0 3.9 2.3 6.1 4.8 6.1s4.8-2.2 4.8-6.1h-2.6c0 2.4-1.1 3.5-2.2 3.5s-2.2-1.1-2.2-3.5z"/>
  </g>

  <!-- Spoon bowl, pulled clear of the arc with deliberate margin -->
  <ellipse cx="43.6" cy="18.4" rx="4.6" ry="7.0" fill="#CFAE70"/>

  <!-- Discovery point, isolated in the open quadrant of the arc -->
  <circle cx="53" cy="11" r="3.3" fill="#CFAE70"/>
</svg>
