name: Refresh live AnchorLink events on Sites

on:
  schedule:
    # GitHub Actions uses UTC. Distinct minutes keep the two cadences separate.
    - cron: "17 */2 * * *"
    - cron: "47 */6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Day span to refresh"
        required: false
        default: "2"
        type: choice
        options:
          - "2"
          - "7"

permissions: {}

concurrency:
  group: vandy-food-radar-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the day span for this trigger
        id: span
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_DAYS:-}" ]; then
            days="$REQUESTED_DAYS"
          elif [ "${SCHEDULE:-}" = "47 */6 * * *" ]; then
            days=7
          else
            days=2
          fi
          case "$days" in
            2|7) ;;
            *) echo "unsupported day span: $days" >&2; exit 1 ;;
          esac
          echo "days=$days" >> "$GITHUB_OUTPUT"

      - name: Refresh Sites and verify the persisted listing
        env:
          VFR_SITES_URL: https://vandy-food-radar.rjy020128.chatgpt.site
          VFR_SITES_SERVICE_TOKEN: ${{ secrets.VFR_SITES_SERVICE_TOKEN }}
          DAYS: ${{ steps.span.outputs.days }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          base = os.environ['VFR_SITES_URL'].rstrip('/')
          token = os.environ['VFR_SITES_SERVICE_TOKEN']
          days = int(os.environ['DAYS'])
          if base != 'https://vandy-food-radar.rjy020128.chatgpt.site' or not token:
              raise SystemExit('Sites URL or service credential is missing or invalid')
          if days not in (2, 7):
              raise SystemExit('Unsupported refresh day span')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          client = urllib.request.build_opener(NoRedirect())

          def request(path, method):
              req = urllib.request.Request(
                  base + path, data=b'' if method == 'POST' else None,
                  method=method, headers={
                      'OAI-Sites-Authorization': 'Bearer ' + token,
                      'Accept': 'application/json',
                  })
              for attempt in range(3):
                  try:
                      with client.open(req, timeout=60) as response:
                          if response.status != 200:
                              raise SystemExit('Unexpected Sites HTTP status')
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      if exc.code in (409, 429, 500, 502, 503, 504) and attempt < 2:
                          retry_after = exc.headers.get('Retry-After', '15')
                          delay = min(30, max(1, int(retry_after))) if retry_after.isdigit() else 15
                          time.sleep(delay)
                          continue
                      raise SystemExit(f'Sites {method} {path} returned HTTP {exc.code}')
                  except (urllib.error.URLError, TimeoutError):
                      if attempt < 2:
                          time.sleep(5)
                          continue
                      raise SystemExit('Sites request failed after bounded retries')

          before = datetime.datetime.now(ZoneInfo('America/Chicago')).date()
          result = request(f'/api/refresh?days={days}', 'POST')
          after = datetime.datetime.now(ZoneInfo('America/Chicago')).date()
          target = datetime.date.fromisoformat(result.get('targetDate', ''))
          expected = [(target + datetime.timedelta(days=offset)).isoformat()
                      for offset in range(days)]
          if not (result.get('ok') is True and before <= target <= after
                  and result.get('days') == expected
                  and result.get('timezone') == 'America/Chicago'
                  and result.get('publishedAt')):
              raise SystemExit('Sites publication readback failed validation: ' + json.dumps({
                  key: result.get(key) for key in ('ok', 'targetDate', 'days', 'timezone', 'publishedAt', 'published')
              }))
          total = 0
          per_day = {row['targetDate']: row for row in result.get('perDay', [])}
          for date in expected:
              feed = request('/api/events?date=' + urllib.parse.quote(date), 'GET')
              events = feed.get('events', [])
              if not (feed.get('state') in ('ok', 'empty')
                      and feed.get('targetDate') == date
                      and feed.get('timezone') == 'America/Chicago'
                      and feed.get('publishedAt') == result['publishedAt']
                      and feed.get('stale') is False
                      and feed.get('eventCount') == len(events)
                      and per_day.get(date, {}).get('published') == len(events)
                      and all(event.get('eventDate') == date for event in events)):
                  raise SystemExit('Sites publication readback failed validation for ' + date)
              total += len(events)
          if total != result.get('published'):
              raise SystemExit('Sites publication readback total differs from refresh')
          print(json.dumps({
              'dates': expected, 'events': total,
              'publishedAt': result['publishedAt'], 'changes': result.get('changes'),
          }))
          PY
