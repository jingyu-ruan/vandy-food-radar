[project]
name = "vandy-food-radar"
version = "0.1.0"
description = "Discovers, verifies, and ranks upcoming Vanderbilt campus events offering free food."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vandy Food Radar" }]
dependencies = [
    "flask>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vandy_food_radar"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["vandy_food_radar", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
files = ["vandy_food_radar", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
